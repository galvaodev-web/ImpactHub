ng-top:15px;border-top:1px solid var(--line);margin-top:22px}.org-hero{display:grid;grid-template-columns:1fr 1fr;gap:42px;align-items:center;margin-bottom:50px}.org-hero img{height:360px;width:100%;object-fit:cover;filter:saturate(.75)}.org-hero h2{font-size:clamp(38px,4.2vw,65px);margin:15px 0}.org-hero p{font-size:14px;color:var(--muted);max-width:420px}.stack{display:grid;gap:24px}.carousel{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:20px;padding-bottom:15px;scrollbar-color:#b5c7ba transparent}.carousel>.campaign-card{flex:0 0 min(360px,85%);scroll-snap-align:start}.overlay{position:fixed;inset:0;background:rgba(10,26,19,.7);display:none;align-items:center;justify-content:center;z-index:100;padding:20px}.overlay.show{display:flex}.modal{width:min(620px,100%);background:var(--cream);max-height:calc(100vh - 40px);overflow:auto;padding:37px;position:relative}.modal h2{font-size:clamp(38px,6vw,60px);margin:10px 30px 16px 0}.modal p{color:var(--muted);font-size:13px}.close{position:absolute;top:17px;right:23px;border:0;background:none;color:var(--ink);font-size:28px}.tabs{display:flex;gap:12px;border-bottom:1px solid var(--line);margin:25px 0}.tabs button{border:0;background:transparent;padding:10px;border-bottom:2px solid transparent;font-size:13px;color:var(--muted)}.tabs button.active{color:var(--green);border-color:var(--green)}.amounts{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin:20px 0}.amount{padding:13px;border:1px solid var(--line);background:transparent}.amount.active{background:var(--green);color:white;border-color:var(--green)}.toast{position:fixed;bottom:25px;right:25px;background:var(--green);color:#fff;padding:15px 22px;font-size:13px;z-index:150;box-shadow:0 10px 25px #0002;max-width:340px}.role-mark{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}.empty{padding:40px 0;color:var(--muted)}.auth{max-width:540px;margin:20px auto 0}.auth h2{font-size:53px;margin:15px 0}.auth .field{margin-top:18px}.demo-label{font-size:10px;letter-spacing:.08em;color:#6f786f}.kicker{font-size:11px;color:var(--muted)}@media(max-width:1150px){.top-inner{width:calc(100% - 45px);gap:15px}.top-nav{gap:14px;margin-left:10px}.main{width:calc(100% - 50px)}.layout .main{padding:44px 26px 70px}.side{flex-basis:210px}.campaign-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:800px){.top-inner{min-height:72px;flex-wrap:wrap;padding:15px 0}.top-nav{order:3;width:100%;overflow-x:auto;margin:0}.nav-link{padding:10px 0;flex-shrink:0}.layout{display:block}.side{position:static;width:100%;height:auto;padding:10px 15px;display:flex;flex-direction:row;overflow-x:auto;gap:4px;border-bottom:1px solid var(--line);border-right:0}.side .eyebrow,.side-foot{display:none}.side-btn{white-space:nowrap;width:auto}.heading{display:block}.heading p{margin-top:15px}.org-hero,.two-col{grid-template-columns:1fr;gap:28px}.org-hero img{height:300px}.grid2{grid-template-columns:1fr}}@media(max-width:560px){.main{width:calc(100% - 34px);padding:36px 0 80px}.layout .main{padding:36px 17px 70px}.top-inner{width:calc(100% - 34px)}.top-actions{gap:7px}.switch{font-size:11px;padding:8px;max-width:130px}.brand{font-size:24px}.heading{margin-bottom:30px}.heading h1{font-size:48px}.stats{gap:12px}.stat strong{font-size:27px}.campaign-grid{grid-template-columns:1fr}.campaign-img{height:250px}.hero-copy{padding:28px}.hero-strip{min-height:340px}.hero-copy h2{font-size:44px}.form-grid{grid-template-columns:1fr}.modal{padding:27px 20px}.amounts{grid-template-columns:repeat(2,1fr)}.section-top h2{font-size:36px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style></head><body><div id="app"></div><div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-label="Janela de ação"><div class="modal" id="modal"></div></div><script>
const photos=['https://images.unsplash.com/photo-1457140072488-8c9b5d9da5bf?auto=format&fit=crop&w=1000&q=80','https://images.unsplash.com/photo-1593113598332-cd288d649433?auto=format&fit=crop&w=1000&q=80','https://images.unsplash.com/photo-1503676260728-1c00da094a0b?auto=format&fit=crop&w=1000&q=80','https://images.unsplash.com/photo-1576091160399-112ba8d25d1d?auto=format&fit=crop&w=1000&q=80','https://images.unsplash.com/photo-1517849845537-4d257902454a?auto=format&fit=crop&w=1000&q=80','https://images.unsplash.com/photo-1497633762265-9d179a990aa6?auto=format&fit=crop&w=1000&q=80'];
const seed=[{id:1,category:'Animais',name:'Um abrigo, muitos recomeços',org:'Casa dos Animais',desc:'Ração, cuidados básicos e materiais para animais acolhidos.',goal:8000,raised:5200,img:photos[0]},{id:2,category:'Alimentação',name:'Alimento que chega mais longe',org:'Rede Solidária',desc:'Apoio à distribuição de cestas para famílias acompanhadas.',goal:15000,raised:9300,img:photos[1]},{id:3,category:'Educação',name:'Aprender abre caminhos',org:'Instituto Horizonte',desc:'Livros e material escolar para atividades educativas.',goal:6000,raised:2600,img:photos[2]},{id:4,category:'Saúde',name:'Cuidar também é prevenir',org:'Coletivo Cuidar',desc:'Itens de higiene e iniciativas de prevenção comunitária.',goal:12000,raised:7900,img:photos[3]},{id:5,category:'Animais',name:'Acolhimento para todos',org:'Abrigo Pata Amiga',desc:'Apoio à estrutura de acolhimento de cães e gatos.',goal:4500,raised:2500,img:photos[4]},{id:6,category:'Educação',name:'Bibliotecas que aproximam',org:'Movimento Ler',desc:'Livros para formação de novos acervos comunitários.',goal:7000,raised:1500,img:photos[5]}];
let campaigns=structuredClone(seed), donations=[{id:'FIN-001',campaign:1,type:'Financeira',detail:'R$ 100,00',status:'Pagamento confirmado',date:'04/11/2026'},{id:'MAT-002',campaign:2,type:'Material',detail:'3 cestas básicas',status:'Em entrega',date:'07/11/2026'}], orgRequests=[{name:'Instituto Caminhos',category:'Educação',status:'Pendente',date:'08/11/2026'},{name:'Associação Florescer',category:'Alimentação',status:'Pendente',date:'09/11/2026'},{name:'Rede Solidariedade',category:'Saúde',status:'Aprovada',date:'04/11/2026'}], reports=[{name:'Possível informação incorreta',target:'Campanha de alimentação',status:'Em análise'}];
const state={role:'doador',page:'inicio',filter:'Todas',search:'',tab:'financeira',selected:1,amount:50,items:1,toast:''};
const menus={doador:[['inicio','Visão geral'],['explorar','Campanhas'],['ongs','Conhecer ONGs'],['doacoes','Minhas doações'],['perfil','Meu perfil']],ong:[['inicio','Visão geral'],['campanhas','Campanhas'],['financeiras','Doações financeiras'],['materiais','Doações materiais'],['contas','Prestação de contas'],['organizacao','Minha organização'],['equipe','Equipe']],admin:[['inicio','Visão geral'],['verificacoes','Verificar ONGs'],['moderacao','Moderação'],['transacoes','Doações'],['usuarios','Usuários'],['relatorios','Relatórios']]};
const currency=n=>Number(n).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function setRole(r){state.role=r;state.page='inicio';state.filter='Todas';state.search='';render();window.scrollTo(0,0)}function go(p){state.page=p;state.filter='Todas';state.search='';render();window.scrollTo(0,0)}
function header(){const menu=menus[state.role];return `<header class="top"><div class="top-inner"><a href="#" class="brand" onclick="event.preventDefault();go('inicio')">impact<span>hub.</span></a>${state.role==='doador'?`<nav class="top-nav" aria-label="Menu do doador">${menu.map(([k,t])=>`<button class="nav-link ${state.page===k?'active':''}" onclick="go('${k}')">${t}</button>`).join('')}</nav>`:`<span class="role-mark">${state.role==='ong'?'ESPAÇO DA ONG':'ADMINISTRAÇÃO'}</span>`}<div class="top-actions"><label class="demo-label" for="role">VISUALIZAR COMO</label><select id="role" class="switch" aria-label="Alternar perfil demonstrativo" onchange="setRole(this.value)"><option value="doador" ${state.role==='doador'?'selected':''}>Doador</option><option value="ong" ${state.role==='ong'?'selected':''}>ONG</option><option value="admin" ${state.role==='admin'?'selected':''}>Administrador</option></select><div class="avatar">IH</div></div></div></header>`}
function sidebar(){         return state.role==='doador'?'':`<aside class="side"><span class="eyebrow">${state.role==='ong'?'GESTÃO DA ORGANIZAÇÃO':'CONTROLE DA PLATAFORMA'}</span>${menus[state.role].map(([k,t],i)=>`<button class="side-btn ${state.page===k?'active':''}" onclick="go('${k}')"><span style="font-size:13px;opacity:.65">${String(i+1).padStart(2,'0')}</span>${t}</button>`).join('')}<div class="side-foot">Protótipo demonstrativo.<br>Nenhum dado real é enviado.</div></aside>`}
function title(k,t,d='',action=''){return `<div class="heading"><div><span class="eyebrow">${k}</span><h1>${t}</h1></div><div>${d?`<p>${d}</p>`:''}${action}</div></div>`}
function stats(arr){return `<div class="stats">${arr.map(([label,value])=>`<div class="stat"><span class="eyebrow">${label}</span><strong>${value}</strong></div>`).join('')}</div>`}
function campaign(c){return `<article class="campaign-card"><div class="campaign-img"><img loading="lazy" src="${esc(c.img)}" alt="Fotografia ilustrativa da campanha"><span class="tag">${esc(c.category)}</span></div><div class="card-meta"><span>${esc(c.org)}</span><span>Campanha demonstrativa</span></div><h3>${esc(c.name)}</h3><p>${esc(c.desc)}</p><div class="progress"><span style="width:${Math.min(100,c.raised/c.goal*100)}%"></span></div><div class="progress-row"><span>${currency(c.raised)} arrecadados</span><span>Meta ${currency(c.goal)}</span></div><button class="linkbtn" onclick="openDonate(${c.id})">Conhecer e apoiar ↗</button></article>`}
function discover(limit=0){let data=campaigns.filter(c=>(state.filter==='Todas'||c.category===state.filter)&&(`${c.name} ${c.org} ${c.category}`.toLowerCase().includes(state.search.toLowerCase())));return `<div class="toolbar"><div class="filters">${['Todas','Animais','Alimentação','Educação','Saúde'].map(f=>`<button class="filter ${state.filter===f?'active':''}" onclick="state.filter='${f}';render()">${f}</button>`).join('')}</div><input class="search" aria-label="Buscar campanhas" placeholder="Buscar campanhas ou organizações..." value="${esc(state.search)}" oninput="state.search=this.value;filterResults()"></div><div id="results" class="campaign-grid">${(limit?data.slice(0,limit):data).map(campaign).join('')||'<p class="empty">Nenhuma campanha encontrada.</p>'}</div>`}
function filterResults(){const el=document.getElementById('results');if(!el)return;let a=campaigns.filter(c=>(state.filter==='Todas'||c.category===state.filter)&&(`${c.name} ${c.org} ${c.category}`.toLowerCase().includes(state.search.toLowerCase())));el.innerHTML=a.map(campaign).join('')||'<p class="empty">Nenhuma campanha encontrada.</p>'}
function donorPage(){if(state.page==='inicio')return `${title('ÁREA DO DOADOR','Boas causas.<br>Boas conexões.','Encontre organizações, contribua com o que puder e acompanhe cada etapa.')}<div class="hero-strip"><img src="https://images.unsplash.com/photo-1559027615-cd4628902d4a?auto=format&fit=crop&w=1600&q=80" alt="Ação social comunitária"><div class="hero-copy"><span class="eyebrow" style="color:#d4e4d8">SOLIDARIEDADE EM MOVIMENTO</span><h2>Seu gesto encontra um destino.</h2><p>Doações financeiras e materiais, registradas com clareza do início ao recebimento.</p><button class="btn" onclick="go('explorar')">Explorar causas ↗</button></div></div>${stats([['Total financeiro ilustrativo',currency(100)],['Ofertas materiais','01'],['Campanhas acompanhadas','02']])}<div class="section-top"><h2>Conheça uma causa.</h2><button class="btn outline small" onclick="go('explorar')">Ver todas ↗</button></div><div class="carousel" aria-label="Carrossel de campanhas">${campaigns.map(campaign).join('')}</div><p class="note">Use o seletor “Visualizar como” para navegar também pelos ambientes da ONG e do administrador.</p>`;
if(state.page==='explorar')return `${title('CAMPANHAS','Causas para<br>conhecer.','Cada campanha é um convite para contribuir. Filtre, descubra e simule uma doação.')}${discover()}`;
if(state.page==='ongs')return `${title('ORGANIZAÇÕES','Pessoas que<br>fazem acontecer.','Conheça as organizações ilustrativas da plataforma e seus projetos.')}<div class="org-hero"><img src="https://images.unsplash.com/photo-1531206715517-5c0ba140b2b8?auto=format&fit=crop&w=1200&q=80" alt="Equipe de voluntariado"><div><span class="eyebrow">CONEXÕES REAIS, DADOS DEMONSTRATIVOS</span><h2>Por trás de cada causa, existe uma organização.</h2><p>Na plataforma real, os perfis apresentarão dados institucionais e situação de verificação. Neste protótipo, todas as organizações são fictícias.</p><button class="btn outline" onclick="go('explorar')">Explorar campanhas ↗</button></div></div><div class="grid2">${[...new Set(campaigns.map(c=>c.org))].map((o,i)=>`<div class="mini-card"><span class="eyebrow">ORGANIZAÇÃO / 0${i+1}</span><h3>${esc(o)}</h3><p>${esc(campaigns.find(c=>c.org===o).category)} · Perfil demonstrativo · Verificação não realizada</p><button class="linkbtn" onclick="openDonate(${campaigns.find(c=>c.org===o).id})">Ver campanha ↗</button></div>`).join('')}</div>`;
if(state.page==='doacoes')return `${title('SUAS CONTRIBUIÇÕES','Minhas doações.','Histórico demonstrativo de ofertas, pagamentos e etapas de recebimento.')}${stats([['Doações registradas',String(donations.length).padStart(2,'0')],['Financeiras',String(donations.filter(d=>d.type==='Financeira').length).padStart(2,'0')],['Materiais',String(donations.filter(d=>d.type==='Material').length).padStart(2,'0')]])}${donationTable()}<p class="note">As doações desta demonstração não representam pagamentos ou entregas reais.</p>`;
return `${title('SUA CONTA','Meu perfil.','Ajustes e preferências nesta demonstração não são armazenados no servidor.')}<div class="two-col"><div class="paper"><h2>Dados pessoais</h2><form onsubmit="event.preventDefault();toast('Perfil demonstrativo atualizado nesta sessão.')"><div class="form-grid"><div class="field"><label>Nome</label><input required value="Visitante ImpactHub"></div><div class="field"><label>E-mail</label><input type="email" required value="visitante@exemplo.com"></div></div><div class="field"><label>Preferência de causa</label><select><option>Qualquer causa</option><option>Animais</option><option>Educação</option><option>Saúde</option><option>Alimentação</option></select></div><button class="btn">Salvar alterações (demonstração)</button></form></div><div class="paper"><h2>Privacidade</h2><p>O histórico e os dados do doador exigirão controles específicos de privacidade, autorização e exclusão, quando aplicável.</p><button class="linkbtn" onclick="toast('Central de privacidade será integrada ao backend.')">Configurações de privacidade ↗</button></div></div>`}
function donationTable(type=''){const entries=donations.filter(d=>!type||d.type===type);return `<div class="tablewrap"><table><thead><tr><th>Registro</th><th>Campanha</th><th>Tipo</th><th>Contribuição</th><th>Data</th><th>Situação</th><th></th></tr></thead><tbody>${entries.map(d=>`<tr><td>${esc(d.id)}</td><td>${esc(campaigns.find(c=>c.id===d.campaign)?.name||'Campanha')}</td><td>${esc(d.type)}</td><td>${esc(d.detail)}</td><td>${esc(d.date)}</td><td><span class="status ${d.status.includes('entrega')||d.status.includes('Pendente')?'wait':''}">${esc(d.status)}</span></td><td><button class="linkbtn" onclick="openReceipt('${esc(d.id)}')">Detalhes ↗</button></td></tr>`).join('')||'<tr><td colspan="7">Nenhum registro disponível.</td></tr>'}</tbody></table></div>`}
function ngoPage(){if(state.page==='inicio')return `${title('GESTÃO DE IMPACTO','Visão geral.','Acompanhe campanhas, doações e necessidades de sua organização.',`<button class="btn" onclick="openCreate()">Nova campanha ↗</button>`)}${stats([['Campanhas demonstrativas',String(campaigns.length).padStart(2,'0')],['Valor registrado',currency(campaigns.reduce((s,c)=>s+c.raised,0))],['Doações registradas',String(donations.length).padStart(2,'0')]])}<div class="two-col"><div><div class="section-top"><h2>Campanhas em curso.</h2><button class="linkbtn" onclick="go('campanhas')">Ver todas ↗</button></div><div class="stack">${campaigns.slice(0,3).map(c=>`<div class="list-row"><div><strong>${esc(c.name)}</strong><small>${currency(c.raised)} de ${currency(c.goal)}</small></div><span class="status">Ativa</span></div>`).join('')}</div></div><div class="paper"><h2>Atividade recente.</h2>${donations.map(d=>`<div class="list-row"><div><strong>${esc(d.detail)}</strong><small>${esc(d.type)} · ${esc(d.date)}</small></div><span class="status ${d.type==='Material'?'wait':''}">${esc(d.status)}</span></div>`).join('')}</div></div>`;
if(state.page==='campanhas')return `${title('ORGANIZAÇÃO','Campanhas.','Crie, acompanhe e administre necessidades da sua organização.',`<button class="btn" onclick="openCreate()">+ Nova campanha</button>`)}<div class="section-top"><h2>Publicadas.</h2></div><div class="campaign-grid">${campaigns.map(c=>`<article class="campaign-card"><div class="campaign-img"><img src="${esc(c.img)}" alt="Imagem ilustrativa" loading="lazy"><span class="tag">${esc(c.category)}</span></div><div class="card-meta"><span>${esc(c.org)}</span><span>Ativa · exemplo</span></div><h3>${esc(c.name)}</h3><p>${esc(c.desc)}</p><div class="progress"><span style="width:${Math.min(100,c.raised/c.goal*100)}%"></span></div><div class="progress-row"><span>${currency(c.raised)}</span><span>${currency(c.goal)}</span></div><button class="linkbtn" onclick="openEdit(${c.id})">Editar campanha ↗</button></article>`).join('')}</div>`;
if(state.page==='financeiras')return `${title('GESTÃO DE DOAÇÕES','Contribuições<br>financeiras.','Consulte registros simulados; a confirmação real exigirá integração com o provedor financeiro.')}${stats([['Transações demonstrativas',String(donations.filter(d=>d.type==='Financeira').length).padStart(2,'0')],['Recebimentos comprovados','Não integrado'],['Integração','Pendente']])}${donationTable('Financeira')}`;
if(state.page==='materiais')return `${title('LOGÍSTICA SOCIAL','Doações<br>materiais.','Acompanhe ofertas de itens, aceite a entrega e confirme o recebimento.')}${donationTable('Material')}<p class="note">Para testar a confirmação, abra “Detalhes” de uma doação material.</p>`;
if(state.page==='contas')return `${title('TRANSPARÊNCIA','Prestação<br>de contas.','Organize evidências e atualizações para que os doadores acompanhem o uso dos recursos.') }<div class="two-col"><div class="paper"><h2>Publicar atualização.</h2><form onsubmit="event.preventDefault();toast('Atualização demonstrativa registrada.');this.reset()"><div class="field"><label>Campanha</label><select>${campaigns.map(c=>`<option>${esc(c.name)}</option>`).join('')}</select></div><div class="field"><label>Título da atualização</label><input required placeholder="Ex.: Compra de materiais concluída"></div><div class="field"><label>Descrição e evidências</label><textarea required placeholder="Descreva o que foi realizado e quais comprovantes estarão disponíveis."></textarea></div><button class="btn">Publicar atualização simulada ↗</button></form></div><div class="paper"><h2>Transparência exige evidências.</h2><p>Uma transferência confirmada não comprova o uso final do dinheiro. O sistema real deverá distinguir registros financeiros, comprovantes e resultados declarados pela ONG.</p><p style="margin-top:20px">Documentos e anexos exigirão armazenamento seguro, revisão e controle de acesso.</p></div></div>`;
if(state.page==='organizacao')return `${title('IDENTIDADE INSTITUCIONAL','Minha organização.','Dados institucionais e verificação de representantes.',`<span class="status wait">Verificação demonstrativa</span>`)}<div class="two-col"><div class="paper"><h2>Informações cadastrais.</h2><form onsubmit="event.preventDefault();toast('Dados da ONG alterados apenas nesta demonstração.')"><div class="field"><label>Nome da organização</label><input required value="Casa dos Animais"></div><div class="field"><label>CNPJ (fictício; não validado)</label><input placeholder="00.000.000/0000-00"></div><div class="field"><label>Área de atuação</label><select><option>Proteção animal</option><option>Educação</option><option>Saúde</option><option>Assistência social</option></select></div><button class="btn">Salvar dados demonstrativos</button></form></div><div class="paper"><h2>Verificação.</h2><p>Na versão real, o acesso institucional exigirá confirmação da identidade da organização e dos representantes autorizados. Este protótipo não verifica documentos nem registra CNPJ.</p></div></div>`;
return `${title('COLABORAÇÃO','Equipe e acessos.','Gerencie representantes autorizados com diferentes permissões.') }<div class="section-top"><h2>Colaboradores.</h2><button class="btn small" onclick="openInvite()">Convidar integrante ↗</button></div><div class="tablewrap"><table><thead><tr><th>Nome</th><th>E-mail</th><th>Função</th><th>Status</th></tr></thead><tbody><tr><td>Representante (exemplo)</td><td>representante@exemplo.org</td><td>Gestão institucional</td><td><span class="status">Ativo</span></td></tr></tbody></table></div>`}
function adminPage(){if(state.page==='inicio')return `${title('ADMINISTRAÇÃO','Panorama geral.','Supervisione integridade, cadastros e indicadores demonstrativos.')}${stats([['ONGs aguardando análise',orgRequests.filter(x=>x.status==='Pendente').length],['Campanhas exibidas',campaigns.length],['Denúncias abertas',reports.filter(x=>x.status==='Em análise').length]])}<div class="two-col"><div class="paper"><h2>Verificações pendentes.</h2>${orgRequests.filter(o=>o.status==='Pendente').map(o=>`<div class="list-row"><div><strong>${esc(o.name)}</strong><small>${esc(o.category)}</small></div><button class="linkbtn" onclick="go('verificacoes')">Analisar ↗</button></div>`).join('')||'<p>Nenhuma solicitação pendente.</p>'}</div><div class="paper"><h2>Moderação.</h2>${reports.map(r=>`<div class="list-row"><div><strong>${esc(r.name)}</strong><small>${esc(r.target)}</small></div><span class="status wait">${esc(r.status)}</span></div>`).join('')}</div></div>`;
if(state.page==='verificacoes')return `${title('CONFORMIDADE','Verificar ONGs.','Analise cadastros antes de conceder acesso institucional.') }<div class="tablewrap"><table><thead><tr><th>Organização</th><th>Área</th><th>Solicitação</th><th>Situação</th><th>Ação</th></tr></thead><tbody>${orgRequests.map((o,i)=>`<tr><td>${esc(o.name)}</td><td>${esc(o.category)}</td><td>${esc(o.date)}</td><td><span class="status ${o.status==='Pendente'?'wait':''}">${esc(o.status)}</span></td><td><button class="linkbtn" onclick="reviewOrg(${i})">Analisar ↗</button></td></tr>`).join('')}</tbody></table></div><p class="note">Aprovar aqui altera apenas o estado em memória do protótipo. Não ocorre validação real.</p>`;
if(state.page==='moderacao')return `${title('INTEGRIDADE','Moderação.','Gerencie alertas e relatos de possíveis irregularidades.') }<div class="tablewrap"><table><thead><tr><th>Ocorrência</th><th>Referência</th><th>Situação</th><th>Ação</th></tr></thead><tbody>${reports.map((r,i)=>`<tr><td>${esc(r.name)}</td><td>${esc(r.target)}</td><td><span class="status ${r.status==='Em análise'?'wait':''}">${esc(r.status)}</span></td><td><button class="linkbtn" onclick="reviewReport(${i})">Revisar ↗</button></td></tr>`).join('')}</tbody></table></div>`;
if(state.page==='transacoes')return `${title('AUDITORIA','Doações registradas.','Visão administrativa de transações e ofertas demonstrativas.')}${donationTable()}`;
if(state.page==='usuarios')return `${title('CONTAS','Usuários.','Visão de gerenciamento de perfis e papéis autorizados.') }<div class="tablewrap"><table><thead><tr><th>Conta</th><th>Perfil</th><th>Situação</th><th>Ação</th></tr></thead><tbody><tr><td>Visitante ImpactHub</td><td>Doador</td><td><span class="status">Ativo (exemplo)</span></td><td><button class="linkbtn" onclick="toast('Gestão de usuários será conectada ao backend.')">Ver perfil ↗</button></td></tr><tr><td>Representante ONG</td><td>ONG</td><td><span class="status wait">Simulado</span></td><td><button class="linkbtn" onclick="toast('Gestão de usuários será conectada ao backend.')">Ver perfil ↗</button></td></tr></tbody></table></div>`;
return `${title('INTELIGÊNCIA OPERACIONAL','Relatórios.','Indicadores ilustrativos para orientar a futura camada de análise.')}${stats([['Campanhas de exemplo',campaigns.length],['Arrecadação fictícia',currency(campaigns.reduce((s,c)=>s+c.raised,0))],['Tipos de causa',new Set(campaigns.map(c=>c.category)).size]])}<div class="paper"><h2>Campanhas por área.</h2>${['Animais','Educação','Alimentação','Saúde'].map(a=>{let n=campaigns.filter(c=>c.category===a).length;return `<div class="list-row"><strong>${a}</strong><div style="width:54%;height:3px;background:#d6ded5"><div style="height:3px;width:${n/campaigns.length*100}%;background:var(--green)"></div></div><span>${n}</span></div>`}).join('')}</div><p class="note">Não são métricas de impacto real; servem apenas para testar a disposição das informações.</p>`}
function render(){document.getElementById('app').innerHTML=header()+`<div class="layout">${sidebar()}<main class="main" id="main">${state.role==='doador'?donorPage():state.role==='ong'?ngoPage():adminPage()}<footer class="note" style="margin-top:70px;display:flex;justify-content:space-between;gap:15px;flex-wrap:wrap"><span>impacthub. / sistema demonstrativo · Editorial V2</span><span>Dados ilustrativos · Nenhum pagamento real</span></footer></main></div>`}
function openModal(html){document.getElementById('modal').innerHTML=`<button class="close" aria-label="Fechar janela" onclick="closeModal()">×</button>${html}`;document.getElementById('overlay').classList.add('show');document.body.style.overflow='hidden';document.querySelector('.close').focus()}
function closeModal(){document.getElementById('overlay').classList.remove('show');document.body.style.overflow=''}document.getElementById('overlay').addEventListener('click',e=>{if(e.target.id==='overlay')closeModal()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
function openDonate(id){state.selected=id;state.tab='financeira';state.amount=50;state.items=1;drawDonate()}
function drawDonate(){const c=campaigns.find(x=>x.id===state.selected);openModal(`<span class="eyebrow">CONTRIBUIR / ${esc(c.org)}</span><h2>${esc(c.name)}</h2><p>Escolha a forma de contribuição. Esta é apenas uma simulação e não processará pagamentos nem ofertas reais.</p><div class="tabs"><button class="${state.tab==='financeira'?'active':''}" onclick="state.tab='financeira';drawDonate()">Doação financeira</button><button class="${state.tab==='material'?'active':''}" onclick="state.tab='material';drawDonate()">Doação material</button></div>${state.tab==='financeira'?`<span class="eyebrow">SELECIONE UM VALOR</span><div class="amounts">${[25,50,100,200].map(n=>`<button class="amount ${state.amount===n?'active':''}" onclick="state.amount=${n};drawDonate()">${currency(n)}</button>`).join('')}</div><div class="field"><label for="amt">Outro valor (R$)</label><input id="amt" min="1" max="100000" type="number" value="${state.amount}" oninput="state.amount=Number(this.value)"></div><button class="btn" style="width:100%" onclick="submitDonation()">Simular contribuição ↗</button>`:`<div class="field"><label for="material">Material oferecido</label><select id="material"><option>Alimentos e cestas básicas</option><option>Roupas e agasalhos</option><option>Itens de higiene</option><option>Material escolar</option><option>Ração para animais</option></select></div><div class="field"><label for="qty">Quantidade de unidades</label><input id="qty" type="number" min="1" max="1000" value="${state.items}"></div><div class="field"><label for="delivery">Forma de entrega pretendida</label><select id="delivery"><option>Entrega presencial</option><option>Coleta pela ONG, se disponível</option><option>Transporte por parceiro, se disponível</option></select></div><button class="btn" style="width:100%" onclick="submitDonation()">Registrar oferta simulada ↗</button>`}<div class="note">Na versão real, a ONG deverá confirmar o recebimento de materiais; o provedor financeiro deverá confirmar pagamentos.</div>`)}
function submitDonation(){const c=campaigns.find(x=>x.id===state.selected);let detail,status,type;if(state.tab==='financeira'){const v=Number(document.getElementById('amt')?.value);if(!Number.isFinite(v)||v<1||v>100000){toast('Informe um valor válido entre R$ 1 e R$ 100.000.');return}detail=currency(v);type='Financeira';status='Pendente (simulação)'}else{const q=Number(document.getElementById('qty')?.value);if(!Number.isInteger(q)||q<1||q>1000){toast('Informe uma quantidade válida de 1 a 1.000.');return}detail=`${q} × ${document.getElementById('material').value}`;type='Material';status='Oferta registrada'}donations.unshift({id:(type==='Financeira'?'FIN':'MAT')+'-'+String(Date.now()).slice(-5),campaign:c.id,type,detail,status,date:new Date().toLocaleDateString('pt-BR')});closeModal();toast(`${type==='Financeira'?'Doação':'Oferta'} registrada somente no protótipo.`);if(state.role==='doador')go('doacoes');else render()}
function openReceipt(id){const d=donations.find(x=>x.id===id);if(!d)return;openModal(`<span class="eyebrow">ACOMPANHAMENTO / ${esc(d.id)}</span><h2>Detalhes da doação.</h2><div class="stack">${[['Campanha',campaigns.find(c=>c.id===d.campaign)?.name],['Tipo',d.type],['Contribuição',d.detail],['Data',d.date],['Situação',d.status]].map(([a,b])=>`<div class="list-row"><span class="muted">${esc(a)}</span><strong>${esc(b||'—')}</strong></div>`).join('')}</div>${d.type==='Material'&&state.role==='ong'&&d.status!=='Recebida'?`<button class="btn" style="width:100%;margin-top:20px" onclick="receiveMaterial('${esc(id)}')">Confirmar recebimento simulado ↗</button>`:''}<p class="note">Nenhum comprovante ou transação financeira real foi verificado.</p>`)}
function receiveMaterial(id){const d=donations.find(x=>x.id===id);if(d){d.status='Recebida';closeModal();toast('Recebimento confirmado no protótipo.');render()}}
function openCreate(){openModal(`<span class="eyebrow">GESTÃO DE CAMPANHAS</span><h2>Nova campanha.</h2><form onsubmit="saveCampaign(event)"><div class="field"><label>Título</label><input name="name" required maxlength="90" placeholder="Nome da campanha"></div><div class="form-grid"><div class="field"><label>Categoria</label><select name="category"><option>Educação</option><option>Alimentação</option><option>Saúde</option><option>Animais</option></select></div><div class="field"><label>Meta financeira (R$)</label><input name="goal" type="number" min="1" max="10000000" required></div></div><div class="field"><label>Descrição</label><textarea name="desc" required maxlength="350"></textarea></div><button class="btn">Criar campanha demonstrativa ↗</button></form>`)}
function saveCampaign(e){e.preventDefault();const fd=new FormData(e.target),goal=Number(fd.get('goal'));if(!Number.isFinite(goal)||goal<=0)return;campaigns.unshift({id:Date.now(),category:String(fd.get('category')),name:String(fd.get('name')),org:'Minha ONG (demonstração)',desc:String(fd.get('desc')),goal,raised:0,img:photos[2]});closeModal();toast('Campanha criada em memória; não foi publicada online.');go('campanhas')}
function openEdit(id){const c=campaigns.find(c=>c.id===id);openModal(`<span class="eyebrow">CAMPANHA / EDIÇÃO</span><h2>Editar campanha.</h2><form onsubmit="saveEdit(event,${id})"><div class="field"><label>Título</label><input name="name" maxlength="90" required value="${esc(c.name)}"></div><div class="field"><label>Descrição</label><textarea name="desc" maxlength="350" required>${esc(c.desc)}</textarea></div><div class="field"><label>Meta financeira (R$)</label><input name="goal" type="number" min="1" max="10000000" required value="${c.goal}"></div><button class="btn">Salvar alterações ↗</button></form>`)}
function saveEdit(e,id){e.preventDefault();const c=campaigns.find(c=>c.id===id),fd=new FormData(e.target);c.name=String(fd.get('name'));c.desc=String(fd.get('desc'));c.goal=Number(fd.get('goal'));closeModal();toast('Alterações salvas apenas nesta sessão.');render()}
function reviewOrg(i){const o=orgRequests[i];openModal(`<span class="eyebrow">ANÁLISE INSTITUCIONAL</span><h2>${esc(o.name)}</h2><p>Área: ${esc(o.category)}. Solicitação recebida em ${esc(o.date)}. Documentação não está disponível neste protótipo.</p><div class="note">As decisões abaixo simulam apenas o fluxo de interface e não verificam juridicamente nenhuma ONG.</div><div class="toolbar" style="margin-top:25px"><button class="btn" onclick="decideOrg(${i},'Aprovada')">Simular aprovação</button><button class="btn outline" onclick="decideOrg(${i},'Pendente')">Manter pendente</button></div>`)}function decideOrg(i,s){orgRequests[i].status=s;closeModal();toast('Situação demonstrativa atualizada.');render()}
function reviewReport(i){const r=reports[i];openModal(`<span class="eyebrow">ANÁLISE DE DENÚNCIA</span><h2>${esc(r.name)}</h2><p>Referência: ${esc(r.target)}</p><p class="note">Sem evidências reais nesta demonstração.</p><div class="toolbar" style="margin-top:25px"><button class="btn" onclick="reports[${i}].status='Resolvida';closeModal();render();toast('Denúncia sinalizada como resolvida no protótipo.')">Marcar como resolvida</button><button class="btn outline" onclick="closeModal()">Voltar</button></div>`)}
function openInvite(){openModal(`<span class="eyebrow">EQUIPE</span><h2>Convidar integrante.</h2><form onsubmit="event.preventDefault();closeModal();toast('Convite simulado — nenhum e-mail enviado.')"><div class="field"><label>E-mail</label><input type="email" required placeholder="pessoa@organizacao.org"></div><div class="field"><label>Função</label><select><option>Colaborador</option><option>Gestor de campanhas</option><option>Administrador da ONG</option></select></div><button class="btn">Simular convite ↗</button></form>`)}
let timer;function toast(msg){document.querySelector('.toast')?.remove();const t=document.createElement('div');t.className='toast';t.setAttribute('role','status');t.textContent=msg;document.body.append(t);clearTimeout(timer);timer=setTimeout(()=>t.remove(),3800)}render();
</script></body></html>
